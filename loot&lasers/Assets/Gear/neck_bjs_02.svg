<title id="title">Field Gorget</title><desc id="desc">Low segmented gunmetal horseshoe neck guard, viewed from above with a large open neck aperture, a clear front gap, and compact sky blue fastening clasps. Standalone neckwear, without a wearer or mannequin.</desc>
