<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">Scrapwalker Braces</title><desc id="desc">Exposed improvised leg braces with an oversized left knee hinge, narrow right linkage, mismatched salvaged shin plates, and taped support straps. Paired legs from waist to ankle, without footwear.</desc>
