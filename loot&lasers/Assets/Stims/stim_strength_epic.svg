<title id="title">Strength Infusion Capsule</title><desc id="desc">Strength stim, epic rarity. Broad angular auto-injector with a central reservoir, two auxiliary chambers, armored housing, and an integrated delivery head. Neutral gunmetal casing with #F59E0B attribute-colored fluid and indicators. Delivery end points down-left.</desc>
