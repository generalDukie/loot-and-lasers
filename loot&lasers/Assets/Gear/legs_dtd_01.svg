<title id="title">Patchwork Worklegs</title><desc id="desc">Mismatched black armored trousers with a bulky left tool pocket, differently shaped knee pads, grey tape repairs, and rusty salvaged plates. Paired legs from waist to ankle, without footwear.</desc>
