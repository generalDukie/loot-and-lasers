<title id="title">Emergency Overpants</title><desc id="desc">Baggy black work pants with orange reinforcement panels, grey tape seams, an asymmetric rusted thigh plate, and cinched ankle cuffs. Paired legs from waist to ankle, without footwear.</desc>
