<title id="title">Agility Field Injector</title><desc id="desc">Agility stim, uncommon rarity. Slim syringe with a single exposed fluid chamber, simple plunger, finger flange, and guarded delivery tip. Neutral gunmetal casing with #34D399 attribute-colored fluid and indicators. Delivery end points down-left.</desc>
