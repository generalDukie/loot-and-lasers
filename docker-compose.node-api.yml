# Node gameplay/auth API for Hetzner staging (port 8787).
# Run on the same host as Nakama staging so friends can use the public IP.
#
#   docker compose -f docker-compose.node-api.yml --env-file .env.node-api up -d --build
#
# Required env (see .env.node-api.example):
#   JWT_SECRET
#   LOOT_WALLET_BRIDGE_SECRET (same value supplied to Nakama runtime)

services:
  node-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: lootandlasers-node-api:staging
    container_name: loot-node-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    networks:
      - default
      - loot_backend
    environment:
      NODE_ENV: production
      PORT: "8787"
      SERVE_STATIC: "false"
      TRUST_PROXY: "true"
      RUN_SEED: "${RUN_SEED:-true}"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env.node-api}"
      GAMEPLAY_JWT_TTL_SEC: "${GAMEPLAY_JWT_TTL_SEC:-720}"
      GAMEPLAY_JWT_ISSUER: "${GAMEPLAY_JWT_ISSUER:-lootandlasers-node}"
      GAMEPLAY_JWT_AUDIENCE: "${GAMEPLAY_JWT_AUDIENCE:-lootandlasers-gameplay}"
      NAKAMA_HTTP_URL: "${NAKAMA_HTTP_URL:-http://nakama:7350}"
      NAKAMA_HTTP_KEY: "${NAKAMA_HTTP_KEY:-${LOOT_WALLET_BRIDGE_SECRET}}"
      LOOT_WALLET_BRIDGE_SECRET: "${LOOT_WALLET_BRIDGE_SECRET:?set LOOT_WALLET_BRIDGE_SECRET in .env.node-api}"
      APP_ID: "${APP_ID:-lootandlasers-staging}"
      RELEASE_VERSION: "${RELEASE_VERSION:-dev}"
      GIT_SHA: "${GIT_SHA:-}"
      BUILD_ID: "${BUILD_ID:-}"
      PUBLIC_CLIENT_URL: "${PUBLIC_CLIENT_URL:-https://178.156.210.186}"
      # Leave SMTP unset → register auto-verifies (no email OTP).
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      AUTH_RATE_WINDOW_SEC: "${AUTH_RATE_WINDOW_SEC:-60}"
      AUTH_RATE_MAX: "${AUTH_RATE_MAX:-30}"
      PASSWORD_RECOVERY_RATE_WINDOW_SEC: "${PASSWORD_RECOVERY_RATE_WINDOW_SEC:-900}"
      PASSWORD_RECOVERY_RATE_MAX: "${PASSWORD_RECOVERY_RATE_MAX:-5}"
      RPC_RATE_WINDOW_SEC: "${RPC_RATE_WINDOW_SEC:-60}"
      RPC_RATE_MAX: "${RPC_RATE_MAX:-240}"
    volumes:
      - node_api_data:/app/server/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  node_api_data:
networks:
  loot_backend:
    external: true
    name: loot_backend
