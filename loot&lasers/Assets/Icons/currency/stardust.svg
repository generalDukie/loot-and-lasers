<svg xmlns="http://www.w3.org/2000/svg"
     width="24"
     height="24"
     viewBox="0 0 1024 1024"
     fill="none"
     shape-rendering="geometricPrecision">
  <!-- Loot & Lasers Stardust — visually balanced paths, outline-only wallet fuchsia #E879F9 -->
