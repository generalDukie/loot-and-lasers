services:
  cockroachdb:
    image: cockroachdb/cockroach:latest-v24.1
    command: start-single-node --insecure --store=attrs=ssd,path=/var/lib/cockroach/
    restart: unless-stopped
    volumes:
      - data:/var/lib/cockroach
    expose:
      - "8080"
      - "26257"
    ports:
      - "127.0.0.1:26257:26257"
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health?ready=1"]
      interval: 3s
      timeout: 3s
      retries: 5
  nakama:
    image: registry.heroiclabs.com/heroiclabs/nakama:3.37.0
    entrypoint:
      - "/bin/sh"
      - "-ec"
      - >
          /nakama/nakama migrate up --database.address root@cockroachdb:26257 &&
          exec /nakama/nakama --name nakama1 --database.address root@cockroachdb:26257 --logger.level DEBUG --session.token_expiry_sec 7200 --socket.server_key "${NAKAMA_SOCKET_SERVER_KEY:-defaultkey}" --runtime.http_key "${NAKAMA_HTTP_KEY:-${LOOT_WALLET_BRIDGE_SECRET:-defaulthttpkey}}" --metrics.prometheus_port 9100 --runtime.env "LOOT_DEV_WALLET_MUTATIONS=${LOOT_DEV_WALLET_MUTATIONS:-1}" --runtime.env "LOOT_ENVIRONMENT=${LOOT_ENVIRONMENT:-development}" --runtime.env "LOOT_DEV_REWARD_TEST=${LOOT_DEV_REWARD_TEST:-1}" --runtime.env "LOOT_DEV_LOOT_TEST=${LOOT_DEV_LOOT_TEST:-1}" --runtime.env "LOOT_DEV_MAIL_TEST=${LOOT_DEV_MAIL_TEST:-1}" --runtime.env "LOOT_NODE_INTERNAL_URL=${LOOT_NODE_INTERNAL_URL:-http://loot-node-api:8787}" --runtime.env "LOOT_WALLET_BRIDGE_SECRET=${LOOT_WALLET_BRIDGE_SECRET:-}"
    restart: unless-stopped
    links:
      - "cockroachdb:db"
    depends_on:
      cockroachdb:
        condition: service_healthy
      prometheus:
        condition: service_started
    volumes:
      - ./:/nakama/data
    networks:
      - default
      - loot_backend
    expose:
      - "7349"
      - "7350"
      - "7351"
      - "9100"
    ports:
      - "127.0.0.1:7349:7349"
      - "127.0.0.1:7350:7350"
      - "127.0.0.1:7351:7351"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
  prometheus:
    image: prom/prometheus
    restart: unless-stopped
    entrypoint: /bin/sh -c
    command: |
      'sh -s <<EOF
        cat > ./prometheus.yml <<EON
      global:
        scrape_interval:     15s
        evaluation_interval: 15s

      scrape_configs:
        - job_name: prometheus
          static_configs:
          - targets: ['localhost:9090']

        - job_name: nakama
          metrics_path: /
          static_configs:
          - targets: ['nakama:9100']
      EON
      prometheus --config.file=./prometheus.yml
      EOF'
    ports:
      - '127.0.0.1:9090:9090'
volumes:
  data:
networks:
  loot_backend:
    name: loot_backend
