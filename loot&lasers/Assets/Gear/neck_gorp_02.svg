<title id="title">Supervisor&#x27;s Seal</title><desc id="desc">Thin rigid angular green neck ring with an open center and a large suspended corporate identification badge, linked by a visible metal hanger with pink credentials. Standalone neckwear, without a wearer or mannequin.</desc>
