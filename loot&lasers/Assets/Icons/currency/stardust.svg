        C 710 267, 741 309, 748 392
        C 755 309, 786 267, 866 252
        C 786 237, 755 195, 748 112
        Z"
      stroke-width="30"/>

    <!-- Lower-left sparkle -->
    <path
      d="
        M 276 676
        C 271 730, 251 759, 197 772
        C 251 785, 271 814, 276 868
        C 281 814, 301 785, 355 772
        C 301 759, 281 730, 276 676
