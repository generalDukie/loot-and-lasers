<title id="title">Intellect Precision Injector</title><desc id="desc">Intellect stim, rare rarity. Enclosed pen-shaped injector with side protection rails, a broad fluid window, dose indicator, and integrated delivery tip. Neutral gunmetal casing with #60A5FA attribute-colored fluid and indicators. Delivery end points down-left.</desc>
