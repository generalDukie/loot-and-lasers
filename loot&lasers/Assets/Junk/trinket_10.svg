<title id="title">Counterfeit Prize Idol</title><desc id="desc">Cheap gold-painted plastic prize figure with chipped coating, crude molded features, and a broken pedestal exposing dull plastic underneath. Nonfunctional junk intended only for sale, with no equipment or stat effects.</desc>
