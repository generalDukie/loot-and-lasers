<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">BJ Services Helmet Variant 1 — Service Visor</title>
  <desc id="desc">A low-profile modular ballistic helmet with a broad horizontal visor, clipped corners, side rails, and a compact filter. Gunmetal shell, teal visors and optics, charcoal and black structure, sky blue hardware accents.</desc>
  <defs>
    <linearGradient id="steel" x1="91" y1="104" x2="425" y2="438" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b8c3c9"/><stop offset=".3" stop-color="#606c75"/><stop offset=".68" stop-color="#202a32"/><stop offset="1" stop-color="#7b8891"/>
    </linearGradient>
    <linearGradient id="dark" x1="146" y1="201" x2="359" y2="447" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#293139"/><stop offset=".58" stop-color="#10161c"/><stop offset="1" stop-color="#05090d"/>
    </linearGradient>
    <linearGradient id="visor" x1="113" y1="254" x2="399" y2="254" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a4c50"/><stop offset=".45" stop-color="#35b9b0"/><stop offset=".58" stop-color="#b8eee2"/><stop offset="1" stop-color="#0d5356"/>
    </linearGradient>
    <radialGradient id="sky"><stop offset="0" stop-color="#e3f5ff"/><stop offset=".42" stop-color="#82c9f4"/><stop offset="1" stop-color="#315c7d"/></radialGradient>
  </defs>
  <g stroke="#080c11" stroke-linejoin="round" stroke-linecap="round">
    <!-- Low, clipped ballistic shell. -->
    <path d="M94 213l43-99 75-55h88l75 55 43 99-24 63H118z" fill="url(#steel)" stroke-width="16"/>
    <path d="M152 126l75-45h58l75 45-14 54H166z" fill="#3b4650" stroke="#7b8c97" stroke-width="9"/>
    <path d="M213 83h86l18 31H195z" fill="#1b242c" stroke="#697680" stroke-width="7"/>
    <path d="M232 85v66M280 85v66M167 153h49M345 153h-49" fill="none" stroke="#171f26" stroke-width="7"/>
    <!-- One continuous visor bar. -->
    <path d="M108 213l69-38h158l69 38-29 91H137z" fill="url(#dark)" stroke="#515e67" stroke-width="12"/>
    <path d="M126 228l70-29h120l70 29-22 56H148z" fill="url(#visor)" stroke-width="9"/>
    <path d="M159 239h194M176 262h160" fill="none" stroke="#d4f4e9" stroke-width="4" opacity=".62"/>
    <!-- Straight accessory rails and rectangular ear boxes. -->
    <path d="M86 239h58l20 61-14 130-55 21-27-89z" fill="url(#steel)" stroke-width="12"/>
    <path d="M426 239h-58l-20 61 14 130 55 21 27-89z" fill="url(#steel)" stroke-width="12"/>
    <path d="M78 288h66v48H72zM434 288h-66v48h72z" fill="#202a32" stroke="#7399b2" stroke-width="8"/>
    <path d="M147 296l42 20 67 4 67-4 42-20-18 132-91 50-91-50z" fill="url(#dark)" stroke-width="12"/>
    <!-- Compact rectangular filter, not ceremonial mouth armor. -->
    <path d="M201 343h110l-9 91-46 27-46-27z" fill="#37434c" stroke="#808c94" stroke-width="8"/>
    <path d="M221 367h70M218 390h76M225 414h62" fill="none" stroke="#8195a2" stroke-width="7"/>
    <path d="M98 305h41M414 305h-41M104 321h35M408 321h-35" fill="none" stroke="#90bdd9" stroke-width="6"/>
    <g fill="url(#sky)" stroke="#16232e" stroke-width="4"><circle cx="182" cy="148" r="8"/><circle cx="330" cy="148" r="8"/></g>
    <g fill="#82c9f4" stroke="#24465e" stroke-width="3"><circle cx="114" cy="372" r="7"/><circle cx="398" cy="372" r="7"/></g>
  </g>
</svg>
