<title id="title">Scrapclaw Rig</title><desc id="desc">Exposed wrist repair rig with a splayed open wrench, uneven folding pincers, screwdriver arm, taped supports, orange fittings, and rusty hinge joints. One standalone equipment accessory, without a wearer.</desc>
