<title id="title">Lucky Fuse</title><desc id="desc">Salvaged fuse charm on a bent wire loop, with a visible orange zigzag conductor, mismatched metal caps, grey tape, and a dangling orange pull tab. One standalone equipment accessory, without a wearer.</desc>
